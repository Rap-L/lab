name: Run Iris plots

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-plots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas matplotlib seaborn; fi

      - name: Run plotting script
        run: |
          python plot_iris.py --plot all

      - name: Upload generated plots
        uses: actions/upload-artifact@v4
        with:
          name: iris-plots
          path: plots/*
